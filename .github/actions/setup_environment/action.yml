name: Setup CI Environment
inputs:
  python-version:
    default: "3.11"
    type: string

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.9"
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Install the project
      shell: bash
      run: uv sync --locked --all-extras --dev
